<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D-TUNING // VW Beetle #53 Herbie Spec</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080a0f;
      --panel-bg: rgba(14, 18, 27, 0.85);
      --panel-border: rgba(0, 240, 255, 0.2);
      --neon-cyan: #00f0ff;
      --neon-red: #ff2a4b;
      --text-main: #e2e8f0;
      --text-dim: #708096;
      --carbon-pattern: linear-gradient(27deg, #151515 5px, transparent 5px) 0 5px,
                        linear-gradient(207deg, #151515 5px, transparent 5px) 10px 0,
                        linear-gradient(27deg, #222 5px, transparent 5px) 0 10px,
                        linear-gradient(207deg, #222 5px, transparent 5px) 10px 5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(0deg, rgba(8, 10, 15, 0.95), rgba(8, 10, 15, 0.95)),
        var(--carbon-pattern);
      background-size: 100% 100%, 100% 100%, 20px 20px;
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top HUD Navigation Bar */
    .top-hud-bar {
      background: rgba(10, 12, 18, 0.95);
      border-bottom: 1px solid var(--panel-border);
      padding: 8px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      text-transform: uppercase;
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: blink 1.5s infinite alternate;
    }

    @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Header e Holograma 3D CSS Puro */
    header {
      position: relative;
      text-align: center;
      padding: 60px 20px 30px;
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
      border-bottom: 2px solid rgba(255, 255, 255, 0.05);
    }

    /* Container de Perspectiva 3D do Header */
    .hologram-container {
      perspective: 1000px;
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
    }

    /* O Elemento que gira em 3D */
    .hologram-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spin3D 15s linear infinite;
    }

    /* Faces do Cubo Holográfico */
    .holo-face {
      position: absolute;
      width: 120px;
      height: 120px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: rgba(255,255,255,0.8);
    }

    /* Posicionando as faces no espaço 3D usando Matemática CSS */
    .holo-front  { transform: rotateY(  0deg) translateZ(60px); }
    .holo-right  { transform: rotateY( 90deg) translateZ(60px); }
    .holo-back   { transform: rotateY(180deg) translateZ(60px); }
    .holo-left   { transform: rotateY(-90deg) translateZ(60px); }
    .holo-top    { transform: rotateX( 90deg) translateZ(60px); }
    .holo-bottom { transform: rotateX(-90deg) translateZ(60px); }

    @keyframes spin3D {
      0% { transform: rotateX(0deg) rotateY(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #a1a8b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 15px rgba(0,0,0,0.8);
    }

    p.subtitle {
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      font-size: 0.95rem;
      max-width: 650px;
      margin: 10px auto 0;
      text-transform: uppercase;
    }

    /* Filtros */
    .container {
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 35px;
      background: rgba(14, 18, 27, 0.6);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
    }

    .btn-filter {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      transition: all 0.25s ease;
    }

    .btn-filter:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .btn-filter.active {
      background: var(--neon-cyan);
      border-color: var(--neon-cyan);
      color: #080a0f;
      font-weight: 900;
    }

    /* Grid de Peças - Perspectiva adicionada aqui para o Tilt JS funcionar */
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 22px;
      perspective: 1200px; /* Importante para o efeito 3D dos cards */
    }

    .part-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      
      /* Preparando o card para se mover no espaço 3D */
      transform-style: preserve-3d;
      transform: perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1);
      transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.4s ease-out;
      will-change: transform; /* Otimização de performance */
    }

    .part-card:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 15px 35px rgba(0, 240, 255, 0.15);
    }

    /* Elevação de elementos internos em Z para criar desnível 3D visual */
    .card-header, h3, p, .spec-box {
      transform: translateZ(20px); 
    }
    
    .spec-box {
      transform: translateZ(30px); /* Pula um pouco mais para fora no 3D */
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .part-id {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 3px;
    }

    .tag-original { background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
    .tag-filme { background: rgba(255, 42, 75, 0.1); color: var(--neon-red); border: 1px solid var(--neon-red); }

    .part-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.15rem; color: #fff; margin-bottom: 10px; }
    .part-card p { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 18px; }

    .spec-box {
      background: rgba(5, 7, 10, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--neon-cyan);
      padding: 10px 14px;
      border-radius: 0 4px 4px 0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: #a0aec0;
    }

    .spec-box strong { color: var(--neon-cyan); display: block; margin-bottom: 2px; }

  </style>
</head>
<body>

  <div class="top-hud-bar">
    <div class="hud-status">
      <span class="status-dot"></span>
      <span>3DTUNING // HOLOGRAPHIC MODE: ACTIVE</span>
    </div>
    <div>CHASSIS: VW-117-1963 | RENDER: CSS3D_NATIVE</div>
  </div>

  <header>
    <!-- Substituímos a badge plana pelo Wireframe Holográfico 3D -->
    <div class="hologram-container">
      <div class="hologram-cube">
        <div class="holo-face holo-front">53</div>
        <div class="holo-face holo-back">VW</div>
        <div class="holo-face holo-right"></div>
        <div class="holo-face holo-left"></div>
        <div class="holo-face holo-top"></div>
        <div class="holo-face holo-bottom"></div>
      </div>
    </div>

    <h1>VW BEETLE // HERBIE #53</h1>
    <p class="subtitle">&gt; ANÁLISE ESPACIAL E ESPECIFICAÇÕES DE CORRIDA</p>
  </header>

  <main class="container">
    <div class="filters">
      <button class="btn-filter active" onclick="filterParts('all', this)">TODAS AS PEÇAS</button>
      <button class="btn-filter" onclick="filterParts('exterior', this)">EXTERIOR & BODYKIT</button>
      <button class="btn-filter" onclick="filterParts('mecanica', this)">MOTOR & PERFORMANCE</button>
      <button class="btn-filter" onclick="filterParts('cinema', this)">EFEITOS DE CINEMA</button>
    </div>

    <div class="parts-grid" id="partsGrid">
      <!-- Injetado via JS -->
    </div>
  </main>

  <script>
    const pecasHerbie = [
      { id: "MOD-01", nome: "Cor Branco Pérola (L87)", categoria: "exterior", tipo: "original", descricao: "Pintura oficial VW Pearl Weiss (L87) em creme fosco antirreflexo para estúdio.", especificacao: "OEM VW L87 // ANTI-GLARE" },
      { id: "MOD-02", nome: "Listras Tricolores", categoria: "exterior", tipo: "filme", descricao: "Decalques padrão Tricolor Francês deslocados no eixo longitudinal do veículo.", especificacao: "AZUL MARINHO / BRANCO / VERMELHO" },
      { id: "MOD-03", nome: "Círculo Racing & Nº 53", categoria: "exterior", tipo: "filme", descricao: "Grafismo oficial de competição aplicado nas portas, capô dianteiro e traseiro.", especificacao: "FONT: GOTHIC BLACK // CIRCLE WHITE" },
      { id: "MOD-04", nome: "Teto Solar Ragtop", categoria: "exterior", tipo: "original", descricao: "Teto solar retrátil original em lona dobrável. Equipamento raro para 1963.", especificacao: "VINYL FOLDING TOP // MANUAL" },
      { id: "MOD-05", nome: "Para-choques US-Spec", categoria: "exterior", tipo: "original", descricao: "Para-choques tubulares estilo exportação norte-americana com reforço extra.", especificacao: "AÇO CROMADO // PROTEÇÃO DUPLA" },
      { id: "MOD-06", nome: "Motor Porsche 356", categoria: "mecanica", tipo: "filme", descricao: "Swap de bloco original 1200cc por motor Porsche de dupla carburação Weber.", especificacao: "BOXER 4-CYL 1830CC // > 90 HP" },
      { id: "MOD-07", nome: "Faróis 'Olho de Boi'", categoria: "exterior", tipo: "original", descricao: "Conjunto óptico clássico com lentes convexas e suporte articulado modificado.", especificacao: "LENTES GLASS DOME 1963" },
      { id: "MOD-08", nome: "Pilotagem Traseira Oculta", categoria: "cinema", tipo: "filme", descricao: "Extensão mecânica para piloto-dublê no banco traseiro para cenas 'mágicas'.", especificacao: "EXTENSÃO DE COLUNA & CORRENTES" }
    ];

    function renderParts(items) {
      const grid = document.getElementById('partsGrid');
      grid.innerHTML = items.map(p => `
        <div class="part-card">
          <div class="card-header">
            <span class="part-id">[${p.id}]</span>
            <span class="tag ${p.tipo === 'original' ? 'tag-original' : 'tag-filme'}">
              ${p.tipo === 'original' ? 'OEM VW' : 'CINE MOD'}
            </span>
          </div>
          <h3>${p.nome}</h3>
          <p>${p.descricao}</p>
          <div class="spec-box">
            <strong>Especificação Técnica</strong>
            ${p.especificacao}
          </div>
        </div>
      `).join('');

      // Após renderizar, inicializamos o efeito 3D em cada card novo
      init3DTiltEffect();
    }

    function filterParts(category, clickedElement) {
      document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
      if(clickedElement) clickedElement.classList.add('active');

      if (category === 'all') {
        renderParts(pecasHerbie);
      } else {
        const filtered = pecasHerbie.filter(p => p.categoria === category);
        renderParts(filtered);
      }
    }

    // --- MAGIA DO TILT 3D COM VANILLA JS ---
    function init3DTiltEffect() {
      const cards = document.querySelectorAll('.part-card');

      cards.forEach(card => {
        // Quando o mouse move em cima do card
        card.addEventListener('mousemove', (e) => {
          // Pega as dimensões e posição atual do card
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left; // X do mouse relativo ao card
          const y = e.clientY - rect.top;  // Y do mouse relativo ao card
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          // Calcula a rotação com base na distância do centro (máximo 15 graus)
          const rotateX = ((y - centerY) / centerY) * -15; 
          const rotateY = ((x - centerX) / centerX) * 15;
          
          // Removemos a transição de tempo para que o movimento siga o mouse em tempo real
          card.style.transition = 'none';
          
          // Aplica a transformação 3D matemática
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        });
        
        // Quando o mouse sai do card
        card.addEventListener('mouseleave', () => {
          // Devolve a transição suave e reseta a posição
          card.style.transition = 'transform 0.5s ease-out, box-shadow 0.5s ease-out';
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        });
      });
    }

    // Renderiza a primeira vez
    renderParts(pecasHerbie);
  </script>
</body>
</html>
