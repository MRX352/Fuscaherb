<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fusca Herbie #53 - Raio-X Detalhado</title>
  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: #1e222d;
      --red-accent: #d9383a;
      --blue-accent: #1e40af;
      --cream-white: #f3efe6;
      --text-light: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    /* Header e Faixa Tricolor */
    header {
      position: relative;
      background: #181b22;
      text-align: center;
      padding: 40px 20px;
      border-bottom: 4px solid var(--red-accent);
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 100%;
      background: linear-gradient(90deg, var(--red-accent) 0% 33%, var(--cream-white) 33% 66%, var(--blue-accent) 66% 100%);
      opacity: 0.15;
      pointer-events: none;
    }

    .badge-53 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background-color: var(--cream-white);
      color: #111;
      border-radius: 50%;
      font-weight: 900;
      font-size: 2rem;
      border: 3px solid #111;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2.2rem;
      color: var(--cream-white);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 600px;
      margin: 8px auto 0;
    }

    /* Filtros e Layout Principal */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .btn-filter {
      background-color: var(--card-bg);
      color: var(--text-light);
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-filter:hover, .btn-filter.active {
      background-color: var(--red-accent);
      border-color: var(--red-accent);
      color: #fff;
    }

    /* Grid de Peças */
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .part-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #2e3545;
      transition: transform 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .part-card:hover {
      transform: translateY(-5px);
      border-color: var(--blue-accent);
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .tag-original { background: rgba(30, 64, 175, 0.2); color: #60a5fa; border: 1px solid #1e40af; }
    .tag-filme { background: rgba(217, 56, 58, 0.2); color: #fca5a5; border: 1px solid #d9383a; }

    .part-card h3 {
      font-size: 1.3rem;
      color: var(--cream-white);
      margin-bottom: 10px;
    }

    .part-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    .spec-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      border-left: 3px solid var(--red-accent);
    }

    .spec-box strong {
      color: var(--cream-white);
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.7rem; }
      .badge-53 { width: 55px; height: 55px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-53">53</div>
    <h1>VW Sedan 1963 - Herbie</h1>
    <p class="subtitle">Análise detalhada peça por peça da lenda do cinema. Descubra os segredos mecânicos e os efeitos de cena.</p>
  </header>

  <main class="container">
    <div class="filters">
      <button class="btn-filter active" onclick="filterParts('all')">Todas as Peças</button>
      <button class="btn-filter" onclick="filterParts('exterior')">Exterior & Carroceria</button>
      <button class="btn-filter" onclick="filterParts('mecanica')">Motor & Mecânica</button>
      <button class="btn-filter" onclick="filterParts('cinema')">Truques de Cinema</button>
    </div>

    <div class="parts-grid" id="partsGrid">
      <!-- As peças serão renderizadas via JavaScript -->
    </div>
  </main>

  <script>
    const pecasHerbie = [
      {
        nome: "Cor Branco Pérola (L87)",
        categoria: "exterior",
        tipo: "original",
        descricao: "Cor oficial de fábrica da Volkswagen chamada Pearl Weiss (L87). Diferente do branco puro, possui um tom creme levemente fosco para não refletir excessivamente sob as luzes dos refletores de estúdio.",
        especificacao: "Código VW: L87 / Acabamento: Não-metalizado / Ano: 1963"
      },
      {
        nome: "Listras Tricolores Assimétricas",
        categoria: "exterior",
        tipo: "filme",
        descricao: "Listras nas cores Vermelho, Branco e Azul de corrida francês. Correm do capô dianteiro ao para-choque traseiro, ligeiramente deslocadas para o lado esquerdo do motorista.",
        especificacao: "Padrão: Azul Marinho (Esquerda), Branco (Centro), Vermelho (Direita)"
      },
      {
        nome: "Círculo e Número 53",
        categoria: "exterior",
        tipo: "filme",
        descricao: "Presente nas duas portas, capô e tampa do motor. O número 53 foi escolhido pelo produtor Bill Walsh em homenagem ao jogador de beisebol Don Drysdale da equipe Los Angeles Dodgers.",
        especificacao: "Tipografia: Fonte gótica/redonda preta em círculo branco sem borda"
      },
      {
        nome: "Teto Solar de Pano (Ragtop)",
        categoria: "exterior",
        tipo: "original",
        descricao: "Teto de lona retrátil de fábrica. Era um opcional raríssimo no modelo 1963. Nos filmes, permitia que atores saíssem pelo teto e criava expressividade nas cenas.",
        especificacao: "Material: Vinil impresso/Lona de algodão dobrável"
      },
      {
        nome: "Para-choques Duplos (US-Spec)",
        categoria: "exterior",
        tipo: "original",
        descricao: "Conhecidos como 'poleiros' ou estilo exportação americana, possuem barras tubulares extras de proteção para cumprir normas de segurança dos EUA nos anos 60.",
        especificacao: "Acabamento: Cromado triplo reforçado"
      },
      {
        nome: "Motor Porsche 356 / Super 90",
        categoria: "mecanica",
        tipo: "filme",
        descricao: "Para as cenas em alta velocidade, o motor original de 1200cc (40 cv) foi substituído pelo motor de um Porsche 356 com carburação dupla Weber, rendendo mais de 90 cv.",
        especificacao: "Cilindrada: 1600cc a 1830cc / Freios: Discos nas 4 rodas"
      },
      {
        nome: "Faróis 'Olho de Boi' (Lentes Lisas)",
        categoria: "exterior",
        tipo: "original",
        descricao: "Faróis inclinados com lentes de vidro convexas característicos dos Fuscas até 1966. Nos filmes, os dublês inclinavam ligeiramente a carcaça interna para dar a impressão de piscar ou olhar.",
        especificacao: "Lâmpadas: 6 Volts (convertidas para 12V em cena)"
      },
      {
        nome: "Sistema de Direção Oculta no Banco Traseiro",
        categoria: "cinema",
        tipo: "filme",
        descricao: "Um dos Herbies foi modificado com volante, pedais e alavanca extras instalados no assoalho traseiro. Um piloto dublê deitado no banco traseiro guiava o carro sem aparecer nas câmeras.",
        especificacao: "Mecânica: Coluna de direção estendida via correntes e roldanas"
      },
      {
        nome: "Suspensão Traseira Articulada (Cambagem)",
        categoria: "cinema",
        tipo: "filme",
        descricao: "A suspensão por barra de torção e facões foi modificada com cilindros hidráulicos para permitir que o Herbie 'erguesse' uma das rodas dianteiras ou inclinasse nas curvas.",
        especificacao: "Sistema: Atuadores hidráulicos de acionamento manual"
      },
      {
        nome: "Injetor de Óleo para Fumaça",
        categoria: "cinema",
        tipo: "filme",
        descricao: "Bicos injetores instalados no coletor de escapamento espirravam óleo de mamona ou fluido hidráulico no escapamento quente, criando nuvens densas de fumaça sob comando.",
        especificacao: "Efeito: Fumaça de escapamento para cenas de estresse do motor"
      }
    ];

    function renderParts(items) {
      const grid = document.getElementById('partsGrid');
      grid.innerHTML = items.map(p => `
        <div class="part-card">
          <div>
            <span class="tag ${p.tipo === 'original' ? 'tag-original' : 'tag-filme'}">
              ${p.tipo === 'original' ? 'Peça de Fábrica VW' : 'Modificação de Filme'}
            </span>
            <h3>${p.nome}</h3>
            <p>${p.descricao}</p>
          </div>
          <div class="spec-box">
            <strong>Especificação:</strong> ${p.especificacao}
          </div>
        </div>
      `).join('');
    }

    function filterParts(category) {
      document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'all') {
        renderParts(pecasHerbie);
      } else {
        const filtered = pecasHerbie.filter(p => p.categoria === category);
        renderParts(filtered);
      }
    }

    // Inicialização
    renderParts(pecasHerbie);
  </script>
</body>
</html>
