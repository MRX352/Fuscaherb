<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D-TUNING // VW Beetle #53 Herbie Spec</title>
  
  <!-- Tipografia estilo HUD / Tuning -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080a0f;
      --panel-bg: rgba(14, 18, 27, 0.85);
      --panel-border: rgba(0, 240, 255, 0.2);
      --neon-cyan: #00f0ff;
      --neon-red: #ff2a4b;
      --neon-yellow: #ffb703;
      --text-main: #e2e8f0;
      --text-dim: #708096;
      --carbon-pattern: linear-gradient(27deg, #151515 5px, transparent 5px) 0 5px,
                        linear-gradient(207deg, #151515 5px, transparent 5px) 10px 0,
                        linear-gradient(27deg, #222 5px, transparent 5px) 0 10px,
                        linear-gradient(207deg, #222 5px, transparent 5px) 10px 5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(0deg, rgba(8, 10, 15, 0.95), rgba(8, 10, 15, 0.95)),
        var(--carbon-pattern);
      background-size: 100% 100%, 100% 100%, 20px 20px;
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
      min-height: 100vh;
    }

    /* Top HUD Navigation Bar */
    .top-hud-bar {
      background: rgba(10, 12, 18, 0.95);
      border-bottom: 1px solid var(--panel-border);
      padding: 8px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: blink 1.5s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Header Estilo Oficina 3DTuning */
    header {
      position: relative;
      text-align: center;
      padding: 50px 20px 30px;
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
      border-bottom: 2px solid rgba(255, 255, 255, 0.05);
    }

    .badge-53-container {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    .badge-53 {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 85px;
      height: 85px;
      background: radial-gradient(circle, #f3efe6 60%, #ccc 100%);
      color: #0d0f14;
      border-radius: 50%;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 2.5rem;
      border: 4px solid #0d0f14;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0,0,0,0.5);
    }

    .badge-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border: 2px dashed var(--neon-cyan);
      border-radius: 50%;
      animation: rotateRing 20s linear infinite;
    }

    @keyframes rotateRing {
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #a1a8b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 15px rgba(0,0,0,0.8);
    }

    p.subtitle {
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
      font-size: 0.95rem;
      max-width: 650px;
      margin: 10px auto 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Painel Principal e Filtros */
    .container {
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 35px;
      background: rgba(14, 18, 27, 0.6);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
    }

    .btn-filter {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      transition: all 0.25s ease;
    }

    .btn-filter:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--neon-cyan);
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .btn-filter.active {
      background: var(--neon-cyan);
      border-color: var(--neon-cyan);
      color: #080a0f;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }

    /* Grid de Peças Estilo 3DTuning Cards */
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 22px;
    }

    .part-card {
      position: relative;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 22px;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Canto chanfrado técnico */
    .part-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 25px 25px 0;
      border-color: transparent var(--neon-cyan) transparent transparent;
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    .part-card:hover {
      transform: translateY(-6px);
      border-color: var(--neon-cyan);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .part-card:hover::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .part-id {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-original {
      background: rgba(0, 240, 255, 0.1);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
    }

    .tag-filme {
      background: rgba(255, 42, 75, 0.1);
      color: var(--neon-red);
      border: 1px solid var(--neon-red);
    }

    .part-card h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .part-card p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 18px;
      font-weight: 500;
    }

    /* Telemetria / Caixa de Especificações */
    .spec-box {
      background: rgba(5, 7, 10, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--neon-cyan);
      padding: 10px 14px;
      border-radius: 0 4px 4px 0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: #a0aec0;
    }

    .spec-box strong {
      color: var(--neon-cyan);
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
      font-size: 0.7rem;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
      .badge-53 { width: 65px; height: 65px; font-size: 1.8rem; }
      .top-hud-bar { font-size: 0.7rem; flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>

  <!-- Barra de Telemetria HUD Topo -->
  <div class="top-hud-bar">
    <div class="hud-status">
      <span class="status-dot"></span>
      <span>3DTUNING // DIAGNOSTIC MODE: ACTIVE</span>
    </div>
    <div>CHASSIS: VW-117-1963 | CONFIG: HERBIE_RACE_SPEC</div>
  </div>

  <header>
    <div class="badge-53-container">
      <div class="badge-ring"></div>
      <div class="badge-53">53</div>
    </div>
    <h1>VW BEETLE // HERBIE #53</h1>
    <p class="subtitle">&gt; ANÁLISE DE COMPONENTES E ESPECIFICAÇÕES DE CORRIDA</p>
  </header>

  <main class="container">
    <!-- Filtros em Estilo Botoes CAD/3D -->
    <div class="filters">
      <button class="btn-filter active" onclick="filterParts('all')">TODAS AS PEÇAS</button>
      <button class="btn-filter" onclick="filterParts('exterior')">EXTERIOR & BODYKIT</button>
      <button class="btn-filter" onclick="filterParts('mecanica')">MOTOR & PERFORMANCE</button>
      <button class="btn-filter" onclick="filterParts('cinema')">EFEITOS DE CINEMA</button>
    </div>

    <!-- Grid Dinâmica -->
    <div class="parts-grid" id="partsGrid">
      <!-- Injetado via JS -->
    </div>
  </main>

  <script>
    const pecasHerbie = [
      {
        id: "MOD-01",
        nome: "Cor Branco Pérola (L87)",
        categoria: "exterior",
        tipo: "original",
        descricao: "Pintura oficial de fábrica VW Pearl Weiss (L87) com tom creme fosco especial antirreflexo para estúdio de filmagem.",
        especificacao: "OEM VW L87 // ACABAMENTO ANTI-GLARE FILM"
      },
      {
        id: "MOD-02",
        nome: "Listras Tricolores Assimétricas",
        categoria: "exterior",
        tipo: "filme",
        descricao: "Decalques esportivos no padrão Tricolor Francês deslocados no eixo longitudinal do veículo.",
        especificacao: "AZUL MARINHO / BRANCO NEUTRO / VERMELHO CORRIDA"
      },
      {
        id: "MOD-03",
        nome: "Círculo Racing & Número 53",
        categoria: "exterior",
        tipo: "filme",
        descricao: "Grafismo oficial de competição aplicado nas portas, capô dianteiro e tampa traseira do motor.",
        especificacao: "FONT: ROUND GOTHIC BLACK // BASE: CIRCLE WHITE 0%"
      },
      {
        id: "MOD-04",
        nome: "Teto Solar Ragtop (Lona)",
        categoria: "exterior",
        tipo: "original",
        descricao: "Teto solar retrátil original em lona dobrável. Equipamento raríssimo para o ano-modelo 1963.",
        especificacao: "VINYL FOLDING TOP // OPERAÇÃO MANUAL REFORÇADA"
      },
      {
        id: "MOD-05",
        nome: "Para-choques Tubulares US-Spec",
        categoria: "exterior",
        tipo: "original",
        descricao: "Para-choques duplos tubular estilo exportação norte-americana com reforço de impacto extra.",
        especificacao: "AÇO CROMADO TRIPLO // PROTEÇÃO TUBULAR DUPLA"
      },
      {
        id: "MOD-06",
        nome: "Motor Porsche 356 Super 90",
        categoria: "mecanica",
        tipo: "filme",
        descricao: "Swap de motor completo. Substituição do bloco original 1200cc por um motor Porsche com dupla carburação Weber.",
        especificacao: "BOXER 4-CYL 1830CC // > 90 HP // WEBER DUAL CARBS"
      },
      {
        id: "MOD-07",
        nome: "Faróis 'Olho de Boi' (Lente Convexa)",
        categoria: "exterior",
        tipo: "original",
        descricao: "Conjunto óptico inclinado clássico com lentes convexas e suporte articulado para expressividade visual.",
        especificacao: "VOLTAGEM: CONVERTIDO 12V // LENTES GLASS DOME 1963"
      },
      {
        id: "MOD-08",
        nome: "Posto de Pilotagem Traseiro Oculto",
        categoria: "cinema",
        tipo: "filme",
        descricao: "Modificação extrema de cockpit traseiro para permitir pilotagem invisível por dublê nas cenas sem motorista.",
        especificacao: "EXTENSÃO DE COLUNA // ROLDANAS & CORRENTES REFORÇADAS"
      },
      {
        id: "MOD-09",
        nome: "Suspensão Ativa Articulada",
        categoria: "cinema",
        tipo: "filme",
        descricao: "Atuadores hidráulicos acoplados aos facões e braços de torção para inclinação e elevação de rodas sob comando.",
        especificacao: "SISTEMA: HIDRÁULICO MANUAL DE ALTA PRESSÃO"
      },
      {
        id: "MOD-10",
        nome: "Injetor de Fumaça no Exaustor",
        categoria: "cinema",
        tipo: "filme",
        descricao: "Bicos injetores no coletor de escape para vaporização rápida de fluido óleo sob alta temperatura.",
        especificacao: "EFEITO: NUVEM DE FUMAÇA INSTANTÂNEA PARA CENAS STUNT"
      }
    ];

    function renderParts(items) {
      const grid = document.getElementById('partsGrid');
      grid.innerHTML = items.map(p => `
        <div class="part-card">
          <div>
            <div class="card-header">
              <span class="part-id">[${p.id}]</span>
              <span class="tag ${p.tipo === 'original' ? 'tag-original' : 'tag-filme'}">
                ${p.tipo === 'original' ? 'OEM VW SPEC' : 'CINEMA MOD'}
              </span>
            </div>
            <h3>${p.nome}</h3>
            <p>${p.descricao}</p>
          </div>
          <div class="spec-box">
            <strong>Telemetria / Especificação</strong>
            ${p.especificacao}
          </div>
        </div>
      `).join('');
    }

    function filterParts(category) {
      document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'all') {
        renderParts(pecasHerbie);
      } else {
        const filtered = pecasHerbie.filter(p => p.categoria === category);
        renderParts(filtered);
      }
    }

    // Inicialização
    renderParts(pecasHerbie);
  </script>
</body>
</html>
